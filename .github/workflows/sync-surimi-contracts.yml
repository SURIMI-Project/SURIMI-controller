name: Sync SURIMI contract inputs

on:
  # 02:00 UTC ≈ 03:00 CET (winter) / 04:00 CEST (summer)
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-surimi-inputs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout target repo (SURIMI-controller)
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout source repo (SURIMI-data_preprocessing) with LFS (sparse)
        uses: actions/checkout@v4.2.2
        with:
          repository: Official-EwE/SURIMI-data_preprocessing
          token: ${{ secrets.SURIMI_SYNC_CSVS_TOKEN }}
          path: source
          sparse-checkout: |
            SURIMI-contracts
          sparse-checkout-cone-mode: true
          lfs: true
          fetch-depth: 1
          # ref: main  # uncomment if needed

      - name: Copy files if changed
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          src_dir="source/SURIMI-contracts"
          base_dir="SURIMI-controller/Includes"
          changed=0

          for src in "$src_dir"/*; do
            [[ -f "$src" ]] || continue
            filename=$(basename "$src")

            # Derive destination subdirectory from filename:
            # e.g. "northwestern_med_contract.yaml" -> "northwestern_med"
            sub_dir="${filename%_contract.yaml}"
            sub_dir="${sub_dir%_contract.yml}"

            dest_dir="${base_dir}/${sub_dir}"
            dest="${dest_dir}/${filename}"
            mkdir -p "$dest_dir"

            if [[ -f "$dest" ]] && cmp -s "$src" "$dest"; then
              echo "No change in $filename"
              continue
            fi

            echo "Updating $filename -> $dest"
            install -m 0644 "$src" "$dest"
            git add "$dest"
            changed=1
          done

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit changes (only if changed)
        if: steps.sync.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync contracts from SURIMI-data_preprocessing"

      - name: Create or update pull request
        if: steps.sync.outputs.changed == '1'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync SURIMI contracts"
          branch: chore/sync-surimi-inputs
          title: "chore: sync SURIMI contracts from SURIMI-data_preprocessing"
          body: |
            Automated sync from **Official-EwE/SURIMI-data_preprocessing** → **SURIMI-controller**.

            **Files updated from** `SURIMI-data_preprocessing/SURIMI-contracts`

            cc @rik-kreeftenberg
          labels: |
            chore
            automation
          delete-branch: true
          # reviewers: rik-kreeftenberg      # uncomment to ensure a review request (and email)
          assignees: rik-kreeftenberg      # uncomment to assign to you (also emails you)

      - name: No changes
        if: steps.sync.outputs.changed != '1'
        run: echo "No changes detected. Nothing to commit or PR."
