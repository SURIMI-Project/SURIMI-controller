syntax = "proto3";

package surimi.v1;

import "google/protobuf/timestamp.proto";
import "surimi/v1/disposition.proto";
import "surimi/v1/sales.proto";
  
option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

message GetSalesSummaryRequest {
  string simulation_id = 1;
  google.protobuf.Timestamp start_date_time = 2;
  google.protobuf.Timestamp end_date_time = 3;
}

message GetSalesSummaryResponse {
  repeated SalesSummary sales_summaries = 1;
}

message GetCatchDispositionSummaryRequest {
  string simulation_id = 1;
  google.protobuf.Timestamp start_date_time = 2;
  google.protobuf.Timestamp end_date_time = 3;
}

message GetCatchDispositionSummaryResponse {
  string measurement_unit = 1; // https://ucum.org/ucum
  repeated DispositionGrid disposition_grids = 2;
}

service FisheryService {
  rpc GetSalesSummary(GetSalesSummaryRequest) returns (GetSalesSummaryResponse);
  rpc GetCatchDispositionSummary(GetCatchDispositionSummaryRequest) returns (GetCatchDispositionSummaryResponse);
}
